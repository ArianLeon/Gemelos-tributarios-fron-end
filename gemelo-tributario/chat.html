<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemelo Chat — Gemelo Tributario</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-shell">

    <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <img src="img/sin_fondo.png" alt="Gemelo Tributario" class="brand-logo-img" style="height:125px;width:auto;display:block;">
      </div>
    </div>

    <span class="sidebar-caption">Régimen actual</span>
    <a href="perfil.html" class="regime-card">
      <div class="regime-card-top">
        <div class="regime-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18v13H3z"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        </div>
        <div class="regime-card-text">
          <span class="value" id="sidebar-regimen">RIMPE Emprendedor</span>
        </div>
        <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <span class="regime-status"><span class="dot"></span>Activo</span>
    </a>

    <nav class="nav-list">
      <a href="dashboard.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        Inicio
      </a>
      <a href="calculadora.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h1M12 11h1M16 11h1M8 15h1M12 15h1M16 15h1M8 19h1M12 19h1"/></svg>
        Calculadora
      </a>
      <a href="recordatorios.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 21a2 2 0 004 0"/></svg>
        Recordatorios
      </a>
      <a href="aprender.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5.5A2.5 2.5 0 015.5 3H12v18H5.5A2.5 2.5 0 013 18.5v-13z"/><path d="M21 5.5A2.5 2.5 0 0018.5 3H12v18h6.5a2.5 2.5 0 002.5-2.5v-13z"/></svg>
        Aprender
      </a>
      <a href="chat.html" class="nav-item active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.4 8.4 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
        Gemelo Chat
      </a>
      <a href="perfil.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        Perfil
      </a>
    </nav>
  </aside>

  <header class="topbar-mobile">
    <div class="brand">
      <img src="img/logo_completo.png" alt="Gemelo Tributario" class="brand-logo-img brand-logo-img-sm" style="height:30px;width:auto;display:block;">
    </div>
  </header>

  <main class="main" style="padding-left:0;padding-right:0;padding-top:0;padding-bottom:0;">
    <div class="card chat-shell" style="border-radius:0;border:none;margin:0;">

      <div class="chat-header">
        <div class="chat-avatar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="7" width="16" height="12" rx="3"/><circle cx="9" cy="13" r="1.3" fill="currentColor"/><circle cx="15" cy="13" r="1.3" fill="currentColor"/><path d="M12 7V4M9 4h6"/></svg>
        </div>
        <div>
          <h3>Gemelo Tributario</h3>
          <p>En línea</p>
        </div>
      </div>

      <div class="chat-messages" id="chat-messages">
        <div class="msg msg-bot">
          <p>Estoy aquí para ayudarte con tus dudas tributarias 🙂 Pregúntame sobre IVA, Renta, RIMPE, retenciones o facturación.</p>
        </div>
      </div>

      <div class="suggestion-row">
        <button type="button" class="suggestion-chip">¿Cuándo debo declarar IVA?</button>
        <button type="button" class="suggestion-chip">¿Qué es el RIMPE?</button>
        <button type="button" class="suggestion-chip">¿Cuál es la diferencia con un contador?</button>
      </div>

      <form id="chat-form" class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Escribe tu pregunta..." autocomplete="off">
        <button type="submit" class="send-btn" aria-label="Enviar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
    </div>
  </main>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    Inicio
  </a>
  <a href="calculadora.html">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h1M12 11h1M16 11h1"/></svg>
    Calc.
  </a>
  <a href="recordatorios.html">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 21a2 2 0 004 0"/></svg>
    Fechas
  </a>
  <a href="aprender.html">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5.5A2.5 2.5 0 015.5 3H12v18H5.5A2.5 2.5 0 013 18.5v-13z"/><path d="M21 5.5A2.5 2.5 0 0018.5 3H12v18h6.5a2.5 2.5 0 002.5-2.5v-13z"/></svg>
    Aprender
  </a>
  <a href="chat.html" class="active">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.4 8.4 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
    Chat
  </a>
  <a href="perfil.html">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
    Perfil
  </a>
</nav>

<script src="js/main.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
